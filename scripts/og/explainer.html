<!doctype html>
<!--
  The share pictures for How it works, drawn by scripts/og-explainers.mjs
  and saved as public/og/<name>.jpg. 1200 by 630, the same frame as
  card.html, but the picture on the right is the explainer's own art: its
  thumb.js, drawn with `share()` if it has one and `thumb()` otherwise, in
  the dark scheme's colours (shared/draw.js, DARK).

  The words come from the address (kicker, title, line, thumb), which the
  script fills in from server/explainers.js. It also serves the repository
  to this page itself, which is why modules can be imported from /public/.
-->
<html lang="en-GB">
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: 'Limelight'; src: url(/public/fonts/limelight-400-latin.woff2) format('woff2'); }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative; background: #0a0c14; color: #f1ead9;
    font-family: system-ui, "Segoe UI", Roboto, Arial, sans-serif;
  }
  .glow { position: absolute; inset: 0; background: radial-gradient(700px 520px at 880px 315px, #1b2032 0%, transparent 70%); }
  .frame { position: absolute; inset: 28px; border: 1px solid rgba(212, 175, 90, 0.35); border-radius: 18px; }
  .frame::before, .frame::after { content: ""; position: absolute; width: 34px; height: 34px; border: 0 solid #d9b563; }
  .frame::before { top: 12px; left: 12px; border-top-width: 2px; border-left-width: 2px; border-top-left-radius: 10px; }
  .frame::after { bottom: 12px; right: 12px; border-bottom-width: 2px; border-right-width: 2px; border-bottom-right-radius: 10px; }
  .words { position: absolute; left: 88px; top: 84px; width: 540px; }
  .mark { font-family: 'Limelight', Georgia, serif; font-size: 40px; }
  .mark em { font-style: normal; font-family: system-ui, sans-serif; font-size: 18px; letter-spacing: 0.14em; color: #b8b09e; margin-left: 6px; }
  .kicker { margin-top: 40px; font-size: 24px; font-weight: 600; color: #d9b563; }
  h1 { margin-top: 10px; font-family: 'Limelight', Georgia, serif; font-weight: 400; font-size: 66px; line-height: 1.04; }
  p { margin-top: 22px; font-size: 27px; line-height: 1.35; color: #cfc7b4; }
  canvas { position: absolute; right: 64px; top: 45px; width: 540px; height: 540px; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="frame"></div>
  <div class="words">
    <div class="mark">Thievery<em>.CO.UK</em></div>
    <div class="kicker" id="k"></div>
    <h1 id="h"></h1>
    <p id="p"></p>
  </div>
  <canvas id="c" width="1080" height="1080"></canvas>
  <script type="module">
    import { DARK, setFace } from '/public/explainers/shared/draw.js';
    const q = new URLSearchParams(location.search);
    document.getElementById('k').textContent = q.get('kicker') || 'How it works';
    document.getElementById('h').textContent = q.get('title') || '';
    document.getElementById('p').textContent = q.get('line') || '';
    if ((q.get('title') || '').length > 26) document.getElementById('h').style.fontSize = '56px';
    setFace(DARK['font-text']);
    const mod = await import('/public' + q.get('thumb'));
    const ctx = document.getElementById('c').getContext('2d');
    ctx.scale(2, 2);
    (mod.share || mod.thumb)(ctx, 540, 540, 4, DARK);
    document.body.dataset.ready = '1';
  </script>
</body>
</html>
