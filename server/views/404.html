  {{head:flashcards}}
  <title>Page not found · Thievery</title>
  <meta name="robots" content="noindex" />
</head>
<body>
  {{bar:public}}

  <main id="main" class="screen home">
    <!-- The one page on the site that is allowed to be all joke: nobody
         meant to be here, so the least it can do is be worth the visit, and
         then show the way out. The empty frame is the missing card. -->
    <div class="home-card not-found">
      <svg class="not-found-card" viewBox="0 0 120 150" aria-hidden="true">
        <rect x="14" y="10" width="92" height="130" rx="8" />
        <path d="M60 52l14 23-14 23-14-23z" />
      </svg>
      <h1>This page has been stolen.</h1>
      <p class="tagline">
        Nothing here but the frame it hung in. Whoever took it left no note,
        and the address may never have held anything at all.
      </p>
      <p><a class="btn primary" href="/cards">Play Thievery</a></p>
      <ul class="not-found-links">
        <li><a href="/">Home</a></li>
        <li><a href="/tools">Tools</a></li>
        <li><a href="/about">About</a></li>
      </ul>
    </div>
  </main>

  {{foot}}
</body>
</html>
